<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>tamaemu</title>
  <link rel="icon" type="image/png" href="maragotchifavicon.png">

  <style>
    :root {
      --bg: #12100e;
      --card: #211d18;
      --sunken: #181512;
      --line: #332d24;
      --line2: #483f32;
      --ink: #f5f1e8;
      --dim: #c2b9aa;
      --faint: #8f8677;
      --btn: #2c2720;
      --btn-hover: #3a332a;
      --primary: #d85d7f;
      --primary-ink: #ffffff;
      --warn: #e0a953;
      --bad: #e85c67;
      --ok: #3fa37c;
      --sans: ui-rounded, "SF Pro Rounded", Quicksand, Nunito, system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden !important;
      position: fixed;
      inset: 0;
      background: #000000;
      color: var(--ink);
      font: 14px/1.5 var(--sans);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #stage-viewport {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    #stage {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 720px;
      height: 720px;
      margin-top: -360px;
      margin-left: -360px;
      transform-origin: center center;
    }

    #device {
      width: 720px;
      height: 720px;
      position: relative;
    }

    #device .glass {
      width: 720px;
      height: 720px;
      background: #181512 url('tama_border.png') center / 720px 720px no-repeat;
      position: relative;
    }

    #device canvas#screen {
      position: absolute;
      left: 168px;
      top: 168px;
      width: 384px;
      height: 384px;
      image-rendering: pixelated;
      background: transparent;
      display: block;
    }

    #device #drop {
      position: absolute;
      left: 168px;
      top: 168px;
      width: 384px;
      height: 384px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      text-align: center;
      padding: 1.5rem;
      cursor: pointer;
      background: rgba(20, 18, 15, 0.88);
      border: 2px dashed var(--line2);
    }
    #drop .big { font-weight: bold; color: var(--ink); font-size: 16px; }
    #drop .sub { color: var(--dim); font-size: 12px; }

    /* 修复遮罩遮挡问题 */
    #device[data-empty="0"] #drop,
    .device[data-empty="0"] #drop {
      display: none !important;
    }

    #device .keys {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 14px;
      display: flex;
      justify-content: center;
      gap: 2.1rem;
      z-index: 15;
    }
    .key {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      border: 2px solid var(--line2);
      background: var(--btn);
      color: var(--dim);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: none;
    }
    .key .l { font-size: 16px; font-weight: bold; }
    .key .k { font-size: 10px; opacity: .7; }
    .key[data-held="1"] { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
    #device.hide-keys .keys { display: none !important; }

    #fabMenuBtn {
      position: fixed !important;
      top: 10px !important;
      right: 10px !important;
      z-index: 99999 !important;
      width: 38px !important;
      height: 38px !important;
      border-radius: 50% !important;
      background: rgba(0, 0, 0, 0.55) !important;
      border: 1px solid rgba(255, 255, 255, 0.3) !important;
      color: #ffffff !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      padding: 0 !important;
      margin: 0 !important;
      cursor: pointer !important;
      opacity: 0.45;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    #fabMenuBtn:active { opacity: 1; transform: scale(0.95); }

    #rgMenuOverlay {
      position: fixed;
      inset: 0;
      z-index: 100000;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .menu-box {
      width: min(92vw, 92vh);
      height: min(92vw, 92vh);
      background: var(--card);
      border: 2px solid var(--line2);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.9);
    }

    .menu-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .6rem .8rem;
      background: var(--sunken);
      border-bottom: 1px solid var(--line);
    }
    .menu-title { font-size: 15px; font-weight: bold; margin: 0; }

    .menu-tabs {
      display: flex;
      gap: .3rem;
      padding: .4rem .6rem;
      background: var(--sunken);
      border-bottom: 1px solid var(--line);
    }
    .tab-btn {
      flex: 1;
      font-size: 12px;
      padding: .4rem .2rem;
      border-radius: 8px;
      background: transparent;
      border: 1px solid var(--line2);
      color: var(--dim);
      cursor: pointer;
      white-space: nowrap;
    }
    .tab-btn.active {
      background: var(--primary);
      color: var(--primary-ink);
      border-color: var(--primary);
      font-weight: 600;
    }

    .menu-body {
      flex: 1;
      padding: .8rem;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: .7rem;
    }
    .tab-pane { display: flex; flex-direction: column; gap: .7rem; }

    .row { display: flex; gap: .5rem; align-items: center; }
    .muted { color: var(--faint); font-size: 12px; line-height: 1.45; }
    button, select, input[type=text] {
      font: inherit;
      font-size: 13px;
      color: var(--ink);
      background: var(--btn);
      border: 2px solid var(--line2);
      border-radius: 8px;
      padding: .4rem .6rem;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: var(--btn-hover); }
    button:disabled { opacity: .35; cursor: default; }
    .primary {
      background: var(--primary);
      color: var(--primary-ink);
      border-color: var(--primary);
      font-weight: 600;
    }
    .danger:hover:not(:disabled) { color: var(--bad); border-color: var(--bad); }

    .pill {
      font-size: 11px;
      color: var(--faint);
      border: 2px solid var(--line2);
      border-radius: 999px;
      padding: 1px 8px;
      white-space: nowrap;
    }
    .pill.on   { color: var(--ok); border-color: var(--ok); }
    .pill.warn { color: var(--warn); border-color: var(--warn); }
    .pill.bad  { color: var(--bad); border-color: var(--bad); }

    #status {
      font-size: 12px;
      color: var(--dim);
      background: var(--sunken);
      border: 2px solid var(--line);
      border-radius: 8px;
      padding: .5rem .7rem;
      white-space: pre-wrap;
      min-height: 2.6em;
    }

    #slotList { display: flex; flex-direction: column; gap: .45rem; }
    .slot {
      border: 2px solid var(--line);
      border-radius: 8px;
      padding: .5rem .65rem;
      background: var(--sunken);
      display: flex;
      flex-direction: column;
      gap: .35rem;
    }
    .slot.active { border-color: var(--primary); }
    .slot .top { display: flex; justify-content: space-between; align-items: baseline; }
    .slot .name { font-weight: bold; font-size: 14px; }
    .slot .sub { color: var(--faint); font-size: 11px; }
    .slot .acts { display: flex; gap: .3rem; flex-wrap: wrap; margin-top: .15rem; }
    .slot .acts button { font-size: 11.5px; padding: .2rem .45rem; }
    .slot .slotdev {
      font-size: 11px;
      background: transparent;
      border: 1px solid var(--line2);
      border-radius: 5px;
      padding: .05rem .2rem;
      color: var(--dim);
    }

    #deviceDlg, #gpioLinkDlg, #helpDlg, #replaceSaveDlg {
      width: min(24rem, calc(100vw - 2rem));
      padding: .9rem 1rem;
      background: var(--card);
      color: var(--ink);
      border: 2px solid var(--line2);
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      z-index: 200000;
    }
    #deviceDlg[open], #gpioLinkDlg[open], #helpDlg[open], #replaceSaveDlg[open] {
      display: flex;
      flex-direction: column;
      gap: .7rem;
    }
    #deviceDlg::backdrop, #gpioLinkDlg::backdrop, #helpDlg::backdrop, #replaceSaveDlg::backdrop {
      background: rgba(0,0,0,0.75);
    }
    #deviceList { display: flex; flex-direction: column; gap: .4rem; max-height: 42vh; overflow-y: auto; }
    .device-row {
      display: flex;
      align-items: center;
      gap: .5rem;
      padding: .45rem .55rem;
      border: 2px solid var(--line);
      border-radius: 8px;
      cursor: pointer;
    }
    .device-row:has(input:checked) { border-color: var(--primary); }
    .device-row .name { flex: 1; font-size: 13px; }
  </style>
</head>

<body>
  <div id="stage-viewport">
    <div id="stage">
      <div class="body device" id="device" data-skin="border" data-empty="1" data-live="0">
        <div class="glass">
          <canvas id="screen" width="128" height="128"></canvas>
          <div id="drop">
            <div class="big">点击或拖入固件</div>
            <div class="sub">选择 Tamagotchi .bin 文件</div>
            <input type="file" id="rom" accept=".bin,.BIN,application/octet-stream" hidden>
          </div>
        </div>
        <div class="keys">
          <button class="key" id="btnA" data-bit="1" disabled><span class="l">A</span><span class="k">Z</span></button>
          <button class="key" id="btnB" data-bit="2" disabled><span class="l">B</span><span class="k">X</span></button>
          <button class="key" id="btnC" data-bit="4" disabled><span class="l">C</span><span class="k">C</span></button>
        </div>
      </div>
    </div>
  </div>

  <button id="fabMenuBtn" type="button" aria-label="菜单设置">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
  </button>

  <div id="rgMenuOverlay" style="display:none;">
    <div class="menu-box">
      <div class="menu-header">
        <div class="row" style="gap:.5rem">
          <h2 class="menu-title">tamaemu</h2>
          <span class="pill" id="statePill">未加载固件</span>
        </div>
        <div class="row" style="gap:.4rem">
          <button id="fullscreenBtn" type="button">⛶ 真全屏</button>
          <button id="closeMenuBtn" class="primary" type="button">返回游戏</button>
        </div>
      </div>

      <div class="menu-tabs">
        <button class="tab-btn active" data-tab="tabControls">🎮 控制运行</button>
        <button class="tab-btn" data-tab="tabSettings">⚙️ 掌机设置</button>
        <button class="tab-btn" data-tab="tabSaves">💾 存档管理</button>
        <button class="tab-btn" data-tab="tabDlc">📦 DLC & 帮助</button>
      </div>

      <div class="menu-body">
        <div class="tab-pane" id="tabControls">
          <div id="status">准备就绪</div>
          <div class="row">
            <button class="primary" id="play" disabled style="flex:1.4">开始 / 暂停</button>
            <button id="saveNow" disabled style="flex:1">立即存档</button>
            <button id="reboot" disabled style="flex:1">重启</button>
          </div>
          <button id="menuPickRomBtn" class="primary" style="width:100%;margin-top:.3rem">📂 载入 / 更换 ROM 固件&hellip;</button>
          <div id="startRow" hidden>
            <div class="muted" id="startNote"></div>
            <button id="startNew" style="width:100%">启动新的拓麻歌子</button>
          </div>
        </div>

        <div class="tab-pane" id="tabSettings" hidden>
          <div id="settingsPanel">
            <div class="muted" id="awakeTier"></div>
            <div class="row" style="gap:.5rem">
              <span style="min-width:3rem">音量</span>
              <input type="range" id="sound" min="0" max="100" step="1" value="100" style="flex:1">
              <button id="soundMute">静音</button>
              <span id="soundVal" style="min-width:4ch;text-align:right">100%</span>
            </div>
            <div class="row" style="justify-content:space-between;margin-top:.4rem">
              <span>时钟流速</span>
              <span class="row" style="gap:.3rem">
                <button id="speedDown" disabled>&minus;</button>
                <span id="speedVal" style="min-width:3.5ch;text-align:center">1&times;</span>
                <button id="speedUp" disabled>+</button>
              </span>
            </div>
            <div class="muted" id="speedNote" hidden></div>

            <hr style="border:0;border-top:1px solid var(--line);margin:.6rem 0">

            <div class="row" style="justify-content:space-between">
              <span>隐藏屏幕按键 (使用 RG Rotate 物理键)</span>
              <input type="checkbox" id="hideKeysToggle" style="width:1.2rem;height:1.2rem">
            </div>

            <div class="muted" style="margin-top:.7rem;margin-bottom:.3rem">RG Rotate 按键映射：</div>
            <div class="row" id="remapRow" style="gap:.3rem;flex-wrap:wrap">
              <button type="button" class="remapBtn" data-btn="A">A: <span class="remapVal" id="remapValA">KeyZ</span></button>
              <button type="button" class="remapBtn" data-btn="B">B: <span class="remapVal" id="remapValB">KeyX</span></button>
              <button type="button" class="remapBtn" data-btn="C">C: <span class="remapVal" id="remapValC">KeyC</span></button>
              <button type="button" id="remapReset">重置默认</button>
            </div>
          </div>
        </div>

        <div class="tab-pane" id="tabSaves" hidden>
          <div class="row" style="justify-content:space-between">
            <span style="font-weight:bold">存档槽位</span>
            <span class="pill" id="quota"></span>
          </div>
          <div class="muted" id="storageNote" hidden></div>
          <div id="slotList"><div class="empty">暂无存档。</div></div>
          <div class="muted" id="persistNote"></div>
          <div class="muted" id="linkNote" hidden></div>
          <div class="row" style="margin-top:.3rem">
            <button id="exportLive" style="flex:1" disabled>导出当前 .sav</button>
            <button id="exportSession" style="flex:1" disabled>导出跨设备存档</button>
          </div>
          <div class="row">
            <button id="importBtn" style="flex:1">导入外部存档&hellip;</button>
            <button id="newRom">开辟新槽位</button>
            <input type="file" id="importFile" accept="application/octet-stream" multiple hidden>
          </div>
        </div>

        <div class="tab-pane" id="tabDlc" hidden>
          <div class="muted" id="dlcUnsupported" hidden></div>
          <div id="dlcBody" hidden style="display:flex;flex-direction:column;gap:.6rem">
            <div style="font-size:12px;font-weight:bold">已安装 DLC：</div>
            <div id="dlcUsage"></div>
            <div class="row">
              <button id="dlcAddBtn" style="flex:1">添加 DLC 文件 (.jpg/.bin)&hellip;</button>
              <button id="dlcClear" hidden>清空</button>
              <input type="file" id="dlcFiles" accept=".jpg,.jpeg,.bin" multiple hidden>
            </div>
            <div id="dlcList"></div>
            <button class="primary" id="dlcInstall" disabled>安装 DLC</button>
            <div id="dlcStatus" class="muted" hidden></div>
            <div id="dlcResults" hidden></div>
            <div class="row">
              <button id="dlcApply" hidden style="flex:1">应用到当前设备</button>
              <button id="dlcDownload" hidden>下载 .sav</button>
            </div>
          </div>
          <div style="border-top:1px solid var(--line);padding-top:.6rem;margin-top:.3rem">
            <button id="helpBtn" style="width:100%">查看操作说明</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <select id="device-sel" hidden></select>
  <button id="settingsBtn" hidden></button>
  <button id="savesHelpBtn" hidden></button>
  <div id="savesHelp" hidden></div>
  <input type="checkbox" id="skinToggle" checked hidden>

  <dialog id="deviceDlg">
    <h2>这是哪一款拓麻歌子？</h2>
    <div id="deviceList"></div>
    <div class="row" style="justify-content:flex-end">
      <button id="deviceCancel">取消</button>
      <button class="primary" id="deviceOk" autofocus>开始</button>
    </div>
  </dialog>

  <dialog id="replaceSaveDlg" aria-labelledby="replaceSaveTitle">
    <h2 id="replaceSaveTitle">替换当前存档？</h2>
    <div class="muted" id="replaceSaveText" style="white-space:pre-line"></div>
    <div class="row" style="justify-content:flex-end">
      <button id="replaceSaveKeep" type="button" autofocus>保留现有存档</button>
      <button class="danger" id="replaceSaveConfirm" type="button">替换</button>
    </div>
  </dialog>

  <dialog id="gpioLinkDlg">
    <h2>Plus Color 暂不支持联机</h2>
    <div class="muted">如果你尝试把 Plus Color 连接到另一台设备，会因为超时而失败。</div>
    <div class="row" style="justify-content:flex-end">
      <button class="primary" id="gpioLinkDlgOk" autofocus>好的</button>
    </div>
  </dialog>

  <dialog id="helpDlg">
    <h2>使用说明</h2>
    <div class="help-section">
      <h3>操作按键</h3>
      <div class="muted">键盘默认 Z、X、C 对应三个按键。可在“掌机设置”中映射为你 RG Rotate 的实体按键。</div>
    </div>
    <div class="row" style="justify-content:flex-end">
      <button class="primary" id="helpDlgOk" autofocus>我知道了</button>
    </div>
  </dialog>

  <!-- 防后退与核心界面同步控制 -->
  <script>
    // 【核心一：历史记录防后退锁】彻底锁死后退，即使系统发送返回指令也不会跳出页面
    (function preventBrowserBack() {
      history.pushState(null, document.title, location.href);
      window.addEventListener('popstate', function() {
        history.pushState(null, document.title, location.href);
      });
    })();

    // 拦截鼠标后退键（部分肩键会伪装成鼠标侧键）
    window.addEventListener('mouseup', function(e) {
      if (e.button === 3 || e.button === 4) {
        e.preventDefault();
        e.stopPropagation();
      }
    }, { capture: true });

    // 屏幕缩放引擎
    function autoFit() {
      var stage = document.getElementById('stage');
      if (!stage) return;
      var w = window.innerWidth || document.documentElement.clientWidth;
      var h = window.innerHeight || document.documentElement.clientHeight;
      var scale = Math.min(w / 720, h / 720);
      stage.style.transform = 'scale(' + scale + ')';
    }
    window.addEventListener('resize', autoFit);
    window.addEventListener('orientationchange', autoFit);
    document.addEventListener('fullscreenchange', function() { setTimeout(autoFit, 60); });
    document.addEventListener('webkitfullscreenchange', function() { setTimeout(autoFit, 60); });
    autoFit();

    // 菜单交互
    var menuOverlay = document.getElementById('rgMenuOverlay');
    var fabBtn = document.getElementById('fabMenuBtn');
    var closeBtn = document.getElementById('closeMenuBtn');
    var pickRomBtn = document.getElementById('menuPickRomBtn');

    fabBtn.onclick = function(e) {
      e.stopPropagation();
      menuOverlay.style.display = 'flex';
    };
    closeBtn.onclick = function() {
      menuOverlay.style.display = 'none';
    };
    menuOverlay.onclick = function(e) {
      if (e.target === menuOverlay) menuOverlay.style.display = 'none';
    };
    pickRomBtn.onclick = function() {
      menuOverlay.style.display = 'none';
      document.getElementById('rom').click();
    };

    var tabBtns = document.querySelectorAll('.tab-btn');
    for (var i = 0; i < tabBtns.length; i++) {
      tabBtns[i].onclick = function() {
        for (var j = 0; j < tabBtns.length; j++) tabBtns[j].classList.remove('active');
        var panes = document.querySelectorAll('.tab-pane');
        for (var k = 0; k < panes.length; k++) panes[k].hidden = true;
        this.classList.add('active');

    fsBtn.onclick = function() {

      var el = doc.documentElement;
      if (!doc.fullscreenElement && !doc.webkitFullscreenElement) {

        if (rfs) rfs.call(el, { navigationUI: 'hide' }).catch(function(){ rfs.call(el); });

  </script>

  <!-- 模拟器核心业务 -->
  <script type="module">
    import createTamaemu from './tamaemu.mjs';
    import * as Slots from './slots.js';
    import * as Dlc from './dlc.js';
    import * as Device from './device.js';
    import * as Link from './link.js';
    import { decodeTamaSave, encodeTamaSave } from './tamasave.js';
    import { applyTamaSaveImport } from './session-import.js';
    import { tryCaptureSession } from './session-capture.js';

    const $ = id => document.getElementById(id);
    const statusEl = $('status');
    const ctx = $('screen').getContext('2d', { alpha: false });
    const say = (m, c) => { statusEl.textContent = m; statusEl.className = c ?? ''; };

    for (const id of ['rom', 'importFile']) $(id).value = '';

    const M = await createTamaemu();
    let romBytes = null, romName = '', running = false, booted = false;
    let romDevice = null;
    let slotId = null;
    let lastNote = '';

    let emuBase = 0;
    const emuTotal = () => emuBase + M._tw_rtc_seconds();

    $('gpioLinkDlgOk').onclick = () => $('gpioLinkDlg').close();
    $('helpBtn').onclick = () => $('helpDlg').showModal();
    $('helpDlgOk').onclick = () => $('helpDlg').close();

    function setState(text, cls) {
      const el = $('statePill');
      const named = booted || romBytes;
      el.textContent = named ? `${titleOf($('device-sel').value)} · ${text}` : text;
      el.className = 'pill' + (cls ? ' ' + cls : '');
    }

    const DEVICE_AKA = { idl: 'also iDLE, Princess Spacy or 15th Anniversary' };
    const nDev = M._tw_device_count();
    const devices = [];
    for (let i = 0; i < nDev; i++)
      devices.push({
        name: M.UTF8ToString(M._tw_device_name(i)),
        title: M.UTF8ToString(M._tw_device_title(i)),
        size: M._tw_device_rom_size(i),

    for (const d of devices) {

    $('device-sel').onchange = () => {

    const titleOf = n => devices.find(d => d.name === n)?.title ?? n;

    // 严丝合缝隐藏遮罩
    function setEmpty(isEmpty) {

    }
    function setLive(isLive) { $('device').dataset.live = isLive ? '1' : '0'; }

    const grabFlash = () => M.HEAPU8.slice(M._tw_flash_ptr(), M._tw_flash_ptr() + M._tw_flash_size());
    const grabRam   = () => M.HEAPU8.slice(M._tw_ram_ptr(), M._tw_ram_ptr() + M._tw_ram_size());

    function grabSession() {
      const n = M._tw_session_size();
      if (n <= 0) throw new Error('the emulator is not ready to save a session');
      const ptr = M._malloc(n);
      try {
        if (M._tw_session_write(ptr, n) !== n) throw new Error('could not capture session');
        return M.HEAPU8.slice(ptr, ptr + n);
      } finally { M._free(ptr); }
    }

    function restoreSession(session) {
      if (!(session instanceof Uint8Array) || !session.length) return false;
      const ptr = M._malloc(session.length);
      try {
        M.HEAPU8.set(session, ptr);
        return M._tw_session_restore(ptr, session.length) === 1;
      } finally { M._free(ptr); }
    }

    function bootFlash(device, bytes) {
      const want = devices.find(d => d.name === device)?.size;
      if (!want) { say(`未知设备 ${device}`, 'bad'); return false; }

      let use = bytes, truncated = 0;
      if (bytes.length > want) { use = bytes.subarray(0, want); truncated = bytes.length - want; }

      const ptr = M._malloc(use.length);
      M.HEAPU8.set(use, ptr);
      const rc = M.ccall('tw_boot', 'number', ['string', 'number', 'number'], [device, ptr, use.length]);
      M._free(ptr);
      if (truncated) lastNote = `使用了前面 ${want / 1048576} MB`;
      if (rc !== 0) { say(`引导失败 (${rc})`, 'bad'); return false; }

      booted = true;
      for (const b of btns) b.disabled = false;
      setHeld(0); pendingRelease = 0;
      setEmpty(false); setLive(true);
      showAwakeTier();
      Dlc.refresh();
      Link.bootHappened();
      if ((device === 'plus-color' || device === 'plus-color-hexa')
          && localStorage.getItem('tamaemu.gpioLinkNote') !== '1'
          && !$('gpioLinkDlg').open)
          $('gpioLinkDlg').showModal();
      showSpeed();
      setState('运行中', 'on');

    }

    function restoreRam(ram) {
      if (!ram?.length) return;
      const n = Math.min(ram.length, M._tw_ram_size());
      M.HEAPU8.set(ram.subarray(0, n), M._tw_ram_ptr());
    }

    M._tw_set_awake(1);
    function showAwakeTier() {
      const el = $('awakeTier');

    }

    let ac = null, gain = null, cursor = 0;
    let audioBuf = null;
    const AUDIO_MAX = 8192;
    const taper = v => v * v;
    let lastAudible = 1;

    function soundLevel() { return Math.min(1, Math.max(0, (+$('sound').value || 0) / 100)); }
    function audioWanted() { return soundLevel() > 0; }

    function applyVolume() {
      const v = soundLevel();
      $('soundVal').textContent = `${Math.round(v * 100)}%`;
      $('soundMute').textContent = v > 0 ? '静音' : '开声';
      if (ac && gain) gain.gain.setTargetAtTime(taper(v), ac.currentTime, 0.01);
    }

    function audioStart() {
      if (!audioWanted()) return;
      if (!ac) {
        const Ctor = window.AudioContext || window.webkitAudioContext;
        if (!Ctor) return;
        ac = new Ctor({ latencyHint: 'interactive' });
        gain = ac.createGain();
        gain.gain.value = taper(soundLevel());
        gain.connect(ac.destination);
        audioBuf = M._malloc(AUDIO_MAX * 4);
      }
      if (ac.state === 'suspended') ac.resume();
      cursor = 0;
      M._tw_audio_reset();
    }

    function audioStop() { if (ac && ac.state === 'running') ac.suspend(); }

    function audioPump() {
      if (!ac || ac.state !== 'running' || !audioWanted()) return;
      const rate = ac.sampleRate;
      const n = M._tw_audio_pull(audioBuf, AUDIO_MAX, rate);
      if (n <= 0) return;
      const now = ac.currentTime;
      if (cursor < now + 0.005 || cursor > now + 0.45) cursor = now + 0.20;
      const buf = ac.createBuffer(1, n, rate);
      buf.copyToChannel(new Float32Array(M.HEAPU8.buffer, audioBuf, n), 0);
      const src = ac.createBufferSource();
      src.buffer = buf;
      src.connect(gain);
      src.start(cursor);
      cursor += n / rate;
    }

    {
      const saved = parseFloat(localStorage.getItem('tamaemu.sound'));
      const v = Number.isFinite(saved) ? Math.min(1, Math.max(0, saved)) : 1;
      $('sound').value = Math.round(v * 100);
      if (v > 0) lastAudible = v;
    }
    applyVolume();

    $('sound').oninput = () => {
      const v = soundLevel();
      if (v > 0) lastAudible = v;
      localStorage.setItem('tamaemu.sound', String(v));
      applyVolume();
      if (v === 0) audioStop();
      else if (running) audioStart();
    };
    $('soundMute').onclick = () => {
      $('sound').value = Math.round((soundLevel() > 0 ? 0 : lastAudible || 1) * 100);
      $('sound').oninput();
    };

    let storageDown = false, liveName = '';
    const fmtDur = s => s >= 3600 ? `${(s / 3600).toFixed(1)}h`
                      : s >= 60   ? `${Math.round(s / 60)}m` : `${Math.round(s)}s`;
    const fmtDate = t => new Date(t).toLocaleString(undefined, { dateStyle: 'short', timeStyle: 'short' });

    async function refreshSlots() {
      if (storageDown) return;
      const all = await Slots.list();
      const list = $('slotList');
      list.replaceChildren();
      if (!all.length) {
        const d = document.createElement('div');
        d.className = 'empty';
        d.textContent = '暂无存档。载入固件后将在此处自动管理。';
        list.append(d);
      }

      for (const s of all) {
        const el = document.createElement('div');
        el.className = 'slot' + (s.id === slotId ? ' active' : '');
        el.innerHTML = `
          <div class="top">
            <span class="name"></span>
            <select class="slotdev"></select>
          </div>
          <div class="sub">游戏内时长 ${fmtDur(s.emuSecs ?? 0)} · ${fmtDate(s.updated)}</div>
          <div class="acts">
            <button class="primary" data-a="play">${s.id === slotId ? '重新加载' : '读取游玩'}</button>
            <button data-a="export">导出</button>
            <button data-a="rename">改名</button>
            <button class="danger" data-a="delete">删除</button>
          </div>`;
        el.querySelector('.name').textContent = s.name;
        const sel = el.querySelector('.slotdev');
        for (const d of devices) {
          if (d.size > (s.flashSize ?? 0)) continue;

          o.value = d.name; o.textContent = d.title;

        el.querySelector('[data-a=play]').onclick = () => { playSlot(s.id); menuOverlay.style.display = 'none'; };
        el.querySelector('[data-a=export]').onclick = () => exportSlot(s.id);
        el.querySelector('[data-a=rename]').onclick = () => renameSlot(s);
        el.querySelector('[data-a=delete]').onclick = () => deleteSlot(s);
        list.append(el);
      }

      const est = await Slots.estimate();
      $('quota').textContent = est?.usage != null ? `${(est.usage / 1048576).toFixed(0)} MB 已用` : '';
    }

    async function playSlot(id) {
      setRunning(false);
      let rec;
      try { rec = await Slots.load(id); } catch (err) { say(`读取失败: ${err.message}`, 'bad'); return; }
      const { meta, flash, ram, session } = rec;
      $('device-sel').value = meta.device;
      if (!bootFlash(meta.device, flash)) return;
      const restoredSession = restoreSession(session);
      if (!restoredSession) restoreRam(ram);
      pendingRelease = 0; setHeld(0);
      cursor = ac ? ac.currentTime : 0;
      M._tw_audio_reset();
      slotId = id;
      Link.claim(id);
      emuBase = meta.emuSecs ?? 0;
      liveName = meta.name;

      draw();
      await refreshSlots();
      setRunning(true);
    }

    async function startFromRom() {
      if (booted) await persistNow('manual');
      const device = booted ? (romDevice ?? $('device-sel').value) : $('device-sel').value;
      $('device-sel').value = device;
      setRunning(false);
      if (!bootFlash(device, romBytes)) return;
      $('startRow').hidden = true;
      emuBase = 0;
      const name = (romName.replace(/\.[^.]+$/, '') || titleOf(device)).slice(0, 40);
      liveName = name;

        const session = tryCaptureSession(grabSession);
        slotId = await Slots.create({
          name, device, flash: grabFlash(), ram: grabRam(), session, emuSecs: 0,

    async function renameSlot(s) {

    async function deleteSlot(s) {
      if (!confirm(`确定删除 "${s.name}" 吗？`)) return;
      await Slots.remove(s.id);
      if (slotId === s.id) { slotId = null; setRunning(false); }

    function download(filename, bytes) {
      const url = URL.createObjectURL(new Blob([bytes], { type: 'application/octet-stream' }));
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    }

    async function exportSlot(id) {

    $('exportLive').onclick = () => {

    $('exportSession').onclick = async () => {

      download(`${safe}.tamasave`, encodeTamaSave({
        lineage: meta.lineage, revision: meta.revision, savedUtcMs: Date.now(),
        device: meta.device, flash, ram, session,
      }));

    };

    async function persistNow(why) {
      if (!booted || slotId == null || storageDown) return;
      const dirty = M._tw_flash_dirty();
      try {
        const session = why === 'manual' ? grabSession() : tryCaptureSession(grabSession);
        const changes = { ram: grabRam(), flash: dirty ? grabFlash() : undefined, emuSecs: emuTotal() };
        if (session != null) changes.session = session;
        await Slots.update(slotId, changes);
        if (dirty) M._tw_flash_clean();
        if (why === 'manual') say(`已保存 ${new Date().toLocaleTimeString()}`, 'ok');
        if (why !== 'pagehide') await refreshSlots();
      } catch (err) {
        say(`保存失败: ${err.message}`, 'bad');
      }

    setInterval(() => persistNow('timer'), 20000);
    document.addEventListener('visibilitychange', () => { if (document.hidden) persistNow('hidden'); });
    $('saveNow').onclick = () => persistNow('manual');

    const NAME_HINTS = [
      [/hexa/i, 'plus-color-hexa'], [/melody/i, 'id-melody'],
      [/4u\s*\+|4uplus|tg16_4u\+/i, '4u'],
      [/idl\w*|id[_ -]?l\b|spacy|anniv\w*|tg14.*idl/i, 'idl'],
      [/color/i, 'plus-color'], [/\b4u\b|tg16_4u/i, '4u-plain'],
      [/\bid\b|id_|_id/i, 'id'], [/\bp'?s\b|_ps|ps_/i, 'ps'],
    ];
    function preselectDevice(fileName, candidates) {
      const hinted = NAME_HINTS.find(([re]) => re.test(fileName));
      if (hinted && candidates.some(d => d.name === hinted[1])) return { pick: hinted[1] };
      return { pick: candidates[0].name };
    }

    $('drop').onclick = () => $('rom').click();
    $('newRom').onclick = () => $('rom').click();
    $('rom').onchange = e => e.target.files[0] && loadRom(e.target.files[0]);

    async function loadRom(file) {
      const bytes = new Uint8Array(await file.arrayBuffer());
      if (bytes.length < 1048576) {
        alert('这不是有效的 ROM 文件！');
        $('rom').value = '';
        return;
      }
      const list = [...devices].sort((a, b) => Math.abs(a.size - bytes.length) - Math.abs(b.size - bytes.length));
      const { pick } = preselectDevice(file.name, list);
      const chosen = await Device.choose({ list, preselect: pick, confirm: booted ? '预载入' : '启动为' });
      $('rom').value = '';
      if (!chosen) return;

      romBytes = bytes; romName = file.name; romDevice = chosen;
      $('play').disabled = false;
      if (booted) {
        $('startNote').textContent = `已就绪: ${file.name} (将作为 ${titleOf(chosen)} 运行)`;
        $('startRow').hidden = false;
        menuOverlay.style.display = 'flex';
      } else {
        $('device-sel').value = chosen;
        await startFromRom();
      }
    }

    function showSpeed() {
      const m = booted ? M._tw_speed() : 1;
      $('speedVal').textContent = `${m}×`;
      $('speedDown').disabled = !booted || m <= 1;
      $('speedUp').disabled = !booted || m >= 600;
      const note = $('speedNote');
      note.hidden = (m <= 1);
      if (m > 1) note.textContent = `当前时钟流速为 ${m} 倍`;
    }
    $('speedUp').onclick = () => { M._tw_speed_step(+1); showSpeed(); };
    $('speedDown').onclick = () => { M._tw_speed_step(-1); showSpeed(); };

    $('play').onclick = async () => {
      if (!booted) { if (romBytes) await startFromRom(); return; }
      setRunning(!running);
    };
    $('startNew').onclick = async () => { if (romBytes) await startFromRom(); };
    $('reboot').onclick = async () => {
      if (slotId == null || !confirm('重新从上次保存的进度启动？')) return;
      await playSlot(slotId);
      menuOverlay.style.display = 'none';
    };

    function setRunning(on) {
      running = on;
      $('play').textContent = on ? '暂停' : (booted ? '继续' : '开始');
      $('saveNow').disabled = $('reboot').disabled = !booted || slotId == null;
      setLive(on);
      setState(on ? '运行中' : (booted ? '已暂停' : '未加载固件'), on ? 'on' : '');
      if (on) { audioStart(); last = performance.now(); acc = 0; requestAnimationFrame(loop); }
      else audioStop();
    }

    const FRAME_MS = 1000 / 60, MAX_STEP_MS = 250, MAX_FRAMES = 6;
    let last = 0, acc = 0;
    function loop(now) {
      if (!running) return;
      requestAnimationFrame(loop);
      let dt = now - last; last = now;
      if (dt > MAX_STEP_MS) dt = MAX_STEP_MS;
      acc += dt;
      let n = 0;
      while (acc >= FRAME_MS && n < MAX_FRAMES) { acc -= FRAME_MS; n++; }
      if (acc > FRAME_MS * MAX_FRAMES) acc = 0;

      if (n) {
        M._tw_buttons(held);
        for (let i = 0; i < n; i++) M._tw_run_frame();
        if (pendingRelease) { setHeld(held & ~pendingRelease); pendingRelease = 0; }
        draw();
        audioPump();
        Link.pump();
      }
    }

    const imgData = new ImageData(128, 128);
    function draw() {
      const p = M._tw_frame();
      imgData.data.set(M.HEAPU8.subarray(p, p + 128 * 128 * 4));
      ctx.putImageData(imgData, 0, 0);
    }

    const btns = [$('btnA'), $('btnB'), $('btnC')];
    let held = 0, pendingRelease = 0;
    function setHeld(mask) {
      held = mask & 7;
      for (const b of btns) b.dataset.held = (held & +b.dataset.bit) ? '1' : '0';
    }
    const press = bit => { pendingRelease &= ~bit; setHeld(held | bit); };
    const release = bit => { pendingRelease |= bit; };

    const BTN_BIT = { A: 1, B: 2, C: 4 };
    const DEFAULT_KEYS = { KeyZ: 1, ArrowLeft: 1, KeyX: 2, ArrowDown: 2, KeyC: 4, ArrowRight: 4 };

    function loadCustomKeys() {
      try { return JSON.parse(localStorage.getItem('tamaemu.keymap') || '{}'); } catch { return {}; }
    }
    let customKeys = loadCustomKeys();

    function buildKeys() {
      const k = { ...DEFAULT_KEYS };
      for (const btn of ['A', 'B', 'C']) {
        const code = customKeys[btn];
        if (code) {
          k[code] = BTN_BIT[btn];
          // 兼容按键代号
          if (/^KeyCode(\d+)$/.test(code)) {
            k[code.replace('KeyCode', '')] = BTN_BIT[btn];
          }
        }
      }
      return k;
    }
    let KEYS = buildKeys();

    // 匹配物理键码
    function matchKey(e) {
      return KEYS[e.code] || KEYS[e.key] || KEYS['KeyCode' + e.keyCode] || KEYS[e.keyCode];
    }

    // 【核心二：捕获阶段拦截所有后退按键】
    function handleKeyEvent(e, isDown) {
      if ($('deviceDlg').open || menuOverlay.style.display !== 'none') return;
      if (!booted) return;
      if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;

      const bit = matchKey(e);
      if (bit) {
        // 关键：强制阻止浏览器一切默认行为（如后退），并停止冒泡
        e.preventDefault();
        e.stopPropagation();
        if (isDown) {
          if (!e.repeat) press(bit);
        } else {
          release(bit);
        }
        return;
      }

      // 如果是 Android 的返回信号（L1、返回键、侧键等）
      if (e.key === 'BrowserBack' || e.key === 'Back' || e.code === 'BrowserBack' || e.keyCode === 4 || e.keyCode === 102) {
        e.preventDefault();
        e.stopPropagation();
      }
    }

    // 在捕获阶段（capture: true）以最高优先级吞掉事件
    window.addEventListener('keydown', e => handleKeyEvent(e, true), { capture: true, passive: false });
    window.addEventListener('keyup', e => handleKeyEvent(e, false), { capture: true, passive: false });

    function syncKeyLabels() {
      for (const btn of ['A', 'B', 'C']) {
        const val = customKeys[btn] ?? (btn === 'A' ? 'KeyZ' : btn === 'B' ? 'KeyX' : 'KeyC');
        $('btn' + btn).querySelector('.k').textContent = val.replace(/^Key/, '').replace(/^KeyCode/, '');
        const el = $('remapVal' + btn);
        if (el) el.textContent = val;
      }
    }
    syncKeyLabels();

    let recording = null;
    function stopRecording() {
      if (!recording) return;
      window.removeEventListener('keydown', recording, true);
      recording = null;
    }

    for (const el of document.querySelectorAll('.remapBtn')) {
      el.onclick = () => {
        stopRecording();
        const btn = el.dataset.btn;
        const valEl = $('remapVal' + btn);
        valEl.textContent = '请按物理键...';
        recording = e => {
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
          if (e.code !== 'Escape' && e.key !== 'Escape') {
            // 优先获取有效键名，防止空串
            const keyId = e.code || e.key || ('KeyCode' + e.keyCode);
            customKeys[btn] = keyId;
            localStorage.setItem('tamaemu.keymap', JSON.stringify(customKeys));
            KEYS = buildKeys();
            syncKeyLabels();
          }
          stopRecording();
        };
        window.addEventListener('keydown', recording, true);
      };
    }

    $('remapReset').onclick = () => {
      stopRecording();
      customKeys = {};
      localStorage.removeItem('tamaemu.keymap');
      KEYS = buildKeys();
      syncKeyLabels();
    };

    function applyHideKeys(on) {
      $('device').classList.toggle('hide-keys', on);
      $('hideKeysToggle').checked = on;
      localStorage.setItem('tamaemu.hidekeys', on ? '1' : '0');
    }
    $('hideKeysToggle').onchange = e => applyHideKeys(e.target.checked);
    applyHideKeys(localStorage.getItem('tamaemu.hidekeys') === '1');

    for (const b of btns) {
      const bit = +b.dataset.bit;
      b.addEventListener('pointerdown', e => { e.preventDefault(); press(bit); });
      b.addEventListener('pointerup', () => release(bit));
      b.addEventListener('pointercancel', () => { pendingRelease = 0; setHeld(held & ~bit); });
    }

    storageDown = !(await Slots.probe());
    Device.init();
    Dlc.init({
      M,
      deviceName: () => booted ? $('device-sel').value : '',
      deviceTitle: () => titleOf($('device-sel').value),
      liveFlash: grabFlash,
      say,
      storageAvailable: () => !storageDown,
      download: (bytes) => download('dlc.sav', bytes),
      applyImage: async (image) => {
        const ram = grabRam();
        const carried = emuTotal();
        const device = $('device-sel').value;
        setRunning(false);
        if (!bootFlash(device, image)) return;
        emuBase = carried;
        restoreRam(ram);
        M._tw_flash_clean();
        draw();
        if (slotId != null) {
          await Slots.update(slotId, { flash: image.slice(), ram: grabRam(), emuSecs: emuTotal() });
        }
        await refreshSlots();
        setRunning(true);
      },
    });

    Link.init(M, {
      device: () => booted ? $('device-sel').value : '',
      running: () => running,
      frame: () => Number(M._tw_cycles()),
      slot: () => slotId,
      onState: () => {},
      onSlotLost: () => { slotId = null; setRunning(false); refreshSlots(); },
    });

    await refreshSlots();
    say('点击屏幕或右上角齿轮载入 ROM。');
  </script>
</body>
</html>
